name: Generate GitHub Stats SVG

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Executa todos os dias à meia-noite (UTC)

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Test LOC generator
        run: node --test tests/generateLoc.test.js

      - name: Restore LOC cache
        uses: actions/cache@v4
        with:
          path: .cache/loc.json
          key: loc-v1-${{ github.repository_owner }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            loc-v1-${{ github.repository_owner }}-

      - name: Generate SVG
        run: node scripts/generateStats.js
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Generate Lines of Code SVG
        run: node scripts/generateLoc.js
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "📊 Update GitHub Stats SVG"
          git pull --rebase origin main
          git push
